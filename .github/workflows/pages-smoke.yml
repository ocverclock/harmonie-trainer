name: Pages deployment smoke check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-smoke.yml'
      - 'index.html'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Confirm updated HTML and all essential course assets are live
        shell: bash
        run: |
          set -euo pipefail
          root="https://ocverclock.github.io/harmonie-trainer"
          html=$(mktemp)
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 20 -H "Cache-Control: no-cache" "$root/?commit=$GITHUB_SHA&attempt=$attempt" -o "$html"; then
              if grep -Fq './src/app.js?v=19' "$html" && grep -Fq './src/style.css?v=7' "$html"; then
                echo "GitHub Pages serves the expected HTML with Scale Designer link (attempt $attempt)"
                ok=1
                break
              fi
            fi
            echo "Waiting for latest Pages deployment ($attempt/24)..."
            sleep 10
          done
          if [[ "$ok" != 1 ]]; then
            echo "::error::Pages is not yet serving the updated homepage entry point"
            exit 1
          fi
          for asset in \
            'src/app.js?v=19' \
            'src/curriculum-ui.js?v=5' \
            'src/voicing-ui.js?v=3' \
            'src/practice-random.js?v=4' \
            'src/construction-setup.js?v=1' \
            'src/music.js?v=4' \
            'src/jazz-lab.js' \
            'src/guide-tones.js' \
            'src/voice-paths.js' \
            'src/voicing-a-b.js' \
            'src/cadence-transpositions.js' \
            'src/voice-leading-feedback.js' \
            'src/jazz-lab-ui.js?v=6' \
            'src/jazz-lab.css?v=6' \
            'src/curriculum.js' \
            'src/course-notes.js' \
            'src/tonality-variants.js' \
            'src/progress-store.js' \
            'src/curriculum.css?v=3' \
            'src/piano-layout.js'; do
            tmp=$(mktemp)
            curl -fsSL --connect-timeout 10 --max-time 20 "$root/$asset" -o "$tmp"
            test -s "$tmp"
            echo "Loaded $asset ($(wc -c <"$tmp") bytes)"
            rm -f "$tmp"
          done
          echo "Public Pages serves eight independent theory levels and tonal-difficulty modes alongside jazz labs."
