<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17325d"><title>Harmonie Trainer</title><style>body{font:17px system-ui;background:#eef3fb;color:#172a47;margin:0}main{max-width:920px;margin:20px auto;padding:16px}.panel{background:white;padding:22px;border-radius:20px;margin:16px 0;box-shadow:0 5px 20px #172a4712}button{border:1px solid #bccbe0;background:white;border-radius:12px;padding:12px;margin:4px;font:inherit;cursor:pointer;min-height:44px}button.on,.primary{background:#2369e9;color:white}h1{font-size:27px}.keyboard{display:flex;overflow:auto;gap:3px;padding:15px 0} .key{flex:0 0 43px;height:130px;background:#f6f9ff;border:1px solid #93a3bd;border-radius:0 0 8px 8px}.key.dark{background:#28354a;color:white;height:95px}.key.on{background:#4d8cf8;color:white}.graph{width:100%;height:auto;background:#f7faff;border-radius:14px}.muted{color:#657590}.score{font-size:36px;font-weight:bold;color:#2369e9}@media(max-width:600px){main{margin:0;padding:8px}.panel{padding:16px}}</style><main><h1>♫ Harmonie Trainer</h1><nav><button id="game" class="primary">Construire</button><button id="voices">Glissements</button><button id="stats">Scores</button></nav><div id="root"></div></main><script>
const pc={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};const nn=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const rows=[['C:C E G','F:F A C','G:G B D','D:D F# A','Bb:Bb D F','Am:A C E','Dm:D F A','Em:E G B','Gm:G Bb D','Cm:C Eb G'],['Cmaj7:C E G B','Fmaj7:F A C E','Gmaj7:G B D F#','Bbmaj7:Bb D F A','Am7:A C E G','Dm7:D F A C','Em7:E G B D','Gm7:G Bb D F','G7:G B D F','C7:C E G Bb','D7:D F# A C','F7:F A C Eb'],['Bdim:B D F','Ddim:D F Ab','Caug:C E G#','Faug:F A C#','Bm7b5:B D F A','Em7b5:E G Bb D']].map(a=>a.map(t=>{let parts=t.split(':');return {name:parts[0],spelled:parts[1],pcs:parts[1].split(' ').map(n=>pc[n])}}));
let mode='game',step='home',level=0,questions=[],i=0,chosen=new Set(),scores=[],checked=false,frame=0,sound=null;
const frames=[{name:'Dm7',notes:[62,65,69,72]},{name:'G7',notes:[62,65,67,71]},{name:'Cmaj7',notes:[64,67,71,72]}],colors=['#e34b57','#2678dc','#2ca969','#9567db'];
function $(id){return document.getElementById(id)}function note(m){return nn[m%12]+(Math.floor(m/12)-1)}function keyboard(set){return '<div class="keyboard" role="group" aria-label="Clavier chromatique">'+Array.from({length:24},(_,j)=>{let k=j%12,black=[1,3,6,8,10].includes(k);return '<button class="key '+(black?'dark ':'')+(set.has(k)?'on':'')+'" data-note="'+k+'" aria-pressed="'+set.has(k)+'">'+nn[k]+'</button>'}).join('')+'</div>'}
function showGame(){if(step==='home'){$('root').innerHTML='<section class="panel"><h2>Construis l’accord</h2><p>28 accords, trois niveaux. Choisis les notes sur le clavier, puis valide.</p>'+['Triades','Accords de septième','Diminués et augmentés'].map((x,n)=>'<button data-level="'+n+'">Niveau '+(n+1)+' — '+x+'</button>').join('')+'</section>';document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));return}if(step==='end'){let good=scores.filter(Boolean).length;$('root').innerHTML='<section class="panel"><h2>Fin de session</h2><div class="score">'+good*10+'/100</div><button id="again">Rejouer</button><button id="home">Accueil</button></section>';$('again').onclick=()=>start(level);$('home').onclick=()=>{step='home';showGame()};return}let q=questions[i],ok=checked&&scores.at(-1),missing=q.pcs.filter(k=>!chosen.has(k)).map(k=>nn[k]),extra=[...chosen].filter(k=>!q.pcs.includes(k)).map(k=>nn[k]);$('root').innerHTML='<section class="panel"><p class="muted">Niveau '+(level+1)+' · Question '+(i+1)+'/10</p><h2>Construis '+q.name+'</h2><p>Touche les notes constitutives de l’accord (octave et ordre libres).</p>'+keyboard(chosen)+'<button id="clear" '+(checked?'disabled':'')+'>Effacer</button><button id="hear">Écouter</button><button class="primary" id="check" '+(checked||!chosen.size?'disabled':'')+'>Valider</button>'+(checked?'<div class="panel" style="background:#f0f6ff"><h3>'+(ok?'Exact !':'À revoir')+'</h3><p>Notes attendues : '+q.spelled+'</p><p>'+(!ok?'Manquantes : '+missing.join(', ')+' ; en trop : '+extra.join(', '):'Toutes les notes sont présentes.')+'</p><button id="next" class="primary">Suivant</button></div>':'')+'</section>';document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{if(checked)return;let n=+b.dataset.note;chosen.has(n)?chosen.delete(n):chosen.add(n);showGame()});$('clear').onclick=()=>{chosen.clear();showGame()};$('hear').onclick=()=>audio([...chosen].map(n=>60+n));$('check').onclick=()=>{let expected=new Set(q.pcs);scores.push(expected.size===chosen.size&&[...expected].every(x=>chosen.has(x)));checked=true;showGame()};if(checked)$('next').onclick=()=>{i++;checked=false;chosen.clear();if(i===10){step='end';try{let a=JSON.parse(localStorage.getItem('harmonie-scores')||'[]');a.push(scores.filter(Boolean).length*10);localStorage.setItem('harmonie-scores',JSON.stringify(a.slice(-50)))}catch(e){}}showGame()}}
function start(n){level=n;let pool=n===2?[...rows[2],...rows[0].slice(0,4)]:[...rows[n]];questions=pool.sort(()=>Math.random()-.5).slice(0,10);i=0;scores=[];checked=false;chosen.clear();step='play';showGame()}
function audio(list){try{let AC=window.AudioContext||window.webkitAudioContext;sound=sound||new AC();sound.resume();for(let m of list){let o=sound.createOscillator(),g=sound.createGain(),t=sound.currentTime;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06/Math.max(list.length,1),t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);o.connect(g).connect(sound.destination);o.start();o.stop(t+1.15)}}catch(e){alert('Audio indisponible')}}
function draw(){let w=900,h=240,small=innerWidth<650,start=small?frame:0,visible=small?[frames[frame]]:frames,dx=visible.length===1?0:620/(visible.length-1),out='<svg class="graph" viewBox="0 0 900 240" role="img" aria-label="Courbes des quatre voix">';for(let j=0;j<visible.length;j++){out+='<text x="'+(130+j*dx)+'" y="28" font-size="21" text-anchor="middle">'+visible[j].name+'</text>'}for(let v=0;v<4;v++){let points=visible.map((f,j)=>(130+j*dx)+','+(208-(f.notes[v]-60)*10)).join(' ');if(visible.length>1)out+='<polyline points="'+points+'" stroke="'+colors[v]+'" stroke-width="4" fill="none"/>';visible.forEach((f,j)=>{let x=130+j*dx,y=208-(f.notes[v]-60)*10;out+='<circle cx="'+x+'" cy="'+y+'" r="11" fill="'+colors[v]+'"/><text x="'+(x+15)+'" y="'+(y+5)+'" font-size="15">'+note(f.notes[v])+'</text>'})}return out+'</svg>'}
function showVoices(){let f=frames[frame];$('root').innerHTML='<section class="panel"><h2>Glissements des voix</h2><p>Dm7 → G7 → Cmaj7 · Quatre couleurs : une couleur par voix.</p>'+draw()+'<div>'+frames.map((x,k)=>'<button data-f="'+k+'" '+(frame===k?'class="primary"':'')+'>'+x.name+'</button>').join('')+'</div><p>Accord actif : '+f.notes.map(note).join(' · ')+'</p>'+keyboard(new Set(f.notes.map(n=>n%12)))+'<button id="listen" class="primary">Écouter l’accord</button><button id="forward">Accord suivant</button></section>';document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{frame=+b.dataset.f;showVoices()});document.querySelectorAll('[data-note]').forEach(b=>b.disabled=true);$('listen').onclick=()=>audio(f.notes);$('forward').onclick=()=>{frame=(frame+1)%3;showVoices()}}
function showStats(){let a=[];try{a=JSON.parse(localStorage.getItem('harmonie-scores')||'[]')}catch(e){}$('root').innerHTML='<section class="panel"><h2>Scores enregistrés localement</h2><p>'+a.length+' sessions</p><p>'+a.slice(-10).join(' · ')+'</p><button id="delete">Effacer les scores</button></section>';$('delete').onclick=()=>{if(confirm('Effacer la progression ?')){localStorage.removeItem('harmonie-scores');showStats()}}}
function activate(m){mode=m;for(let n of ['game','voices','stats'])$(n).className=n===m?'primary':'';m==='game'?showGame():m==='voices'?showVoices():showStats()}for(let n of ['game','voices','stats'])$(n).onclick=()=>activate(n);window.addEventListener('resize',()=>{if(mode==='voices')showVoices()});activate('game');
</script></html>
